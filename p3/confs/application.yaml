# Argo CD Application: watches manifests/ on the dedicated public
# GitHub repo for part 3, and keeps the "dev" namespace continuously
# in sync with it (GitOps).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: playground
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/DouiriMariah/Iot_amattei.git
    targetRevision: HEAD
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
