# Routes on the Host header, served by the Traefik controller bundled
# with K3s:
#   Host: app1.com -> app1
#   Host: app2.com -> app2
#   anything else  -> app3
#
# The "anything else" case uses a host-less rule (no `host:` key) as a
# catch-all, rather than `spec.defaultBackend`: Traefik's Kubernetes
# Ingress provider does not reliably honor defaultBackend, but a rule
# with no host always matches and (being less specific) only applies
# when no host-specific rule matched first.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apps-ingress
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  rules:
    - host: app1.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app1
                port:
                  number: 80
    - host: app2.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app2
                port:
                  number: 80
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app3
                port:
                  number: 80
